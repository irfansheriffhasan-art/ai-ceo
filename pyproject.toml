[project]
name = "ai-ceo"
version = "2.0.0"
description = "AI-CEO: an autonomous multi-agent software company"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ollama>=0.4",
    "rich>=13",
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ai-ceo = "ai_ceo.cli:main"

[tool.setuptools.packages.find]
include = ["ai_ceo*"]

[tool.setuptools.package-data]
ai_ceo = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: needs a Chromium-family browser (Playwright bundled, Edge or Chrome)",
    "live: calls a real LLM provider (slow; opt in with -m live)",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
